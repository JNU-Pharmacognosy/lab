yaml
name: Sync publications from ORCID

on:
  schedule:
    # Every Monday at 03:00 UTC (~ noon KST). Adjust as you like.
    - cron: "0 3 * * 1"
  workflow_dispatch: {} # lets you also trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch latest works from ORCID
        env:
          ORCID_ID: ${{ vars.ORCID_ID }}
        run: node scripts/fetch_orcid.mjs

      - name: Commit updated publications.json (if changed)
        run: |
          git config user.name "orcid-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/publications.json
          git diff --cached --quiet || git commit -m "chore: sync publications from ORCID"
          git push
